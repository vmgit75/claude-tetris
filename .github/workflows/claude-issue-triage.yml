name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            Ejecuta `gh issue view ${{ github.event.issue.number }} --json title,body,labels`
            para obtener el título y la descripción del issue #${{ github.event.issue.number }}
            de este repositorio. Si hace falta contexto adicional, revisa el código
            relevante (game.js, index.html, style.css) con Read/Glob/Grep.

            1. Aplica las labels que correspondan usando ÚNICAMENTE este conjunto
               cerrado de labels ya existentes en el repo (no crees labels nuevas):
               bug, documentation, duplicate, enhancement, good first issue,
               help wanted, invalid, question, wontfix.
               Usa `gh issue edit ${{ github.event.issue.number }} --add-label "..."`
               y, si el issue fue editado y alguna label ya no aplica,
               `--remove-label "..."`.

            2. Publica un comentario de diagnóstico con
               `gh issue comment ${{ github.event.issue.number }} --body "..."`
               que incluya:
               - Resumen breve del problema o solicitud.
               - Causa probable (si es un bug) o alcance de la propuesta (si es
                 una mejora/feature).
               - Archivos y funciones de game.js/index.html/style.css
                 probablemente involucrados.
               - Un enfoque sugerido para abordar la solución, sin escribir
                 código todavía (eso se hará en un paso posterior).

          claude_args: '--allowedTools "Read" "Glob" "Grep" "Bash(gh issue view:*)" "Bash(gh issue edit:*)" "Bash(gh issue comment:*)"'
