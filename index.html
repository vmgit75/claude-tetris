<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        <span class="knob"></span>
      </button>
      <button id="skin-toggle" class="skin-toggle" aria-label="Cambiar skin visual" title="Skins">🎨</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="skin-selector" class="skin-selector hidden">
      <div class="skin-selector-box">
        <p class="skin-selector-title">SKIN VISUAL</p>
        <div class="skin-options">
          <button class="skin-option" data-skin="retro">
            <span class="skin-swatch skin-swatch-retro"></span>
            Retro
          </button>
          <button class="skin-option" data-skin="neon">
            <span class="skin-swatch skin-swatch-neon"></span>
            Neon
          </button>
          <button class="skin-option" data-skin="pastel">
            <span class="skin-swatch skin-swatch-pastel"></span>
            Pastel
          </button>
          <button class="skin-option" data-skin="pixel">
            <span class="skin-swatch skin-swatch-pixel"></span>
            Pixel Art
          </button>
        </div>
        <button id="skin-selector-close">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
